<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#e2e2e2",
                        "surface-bright": "#f9f9f9",
                        "secondary": "#5e5e5e",
                        "on-error-container": "#93000a",
                        "primary-fixed-dim": "#c6c6c6",
                        "on-secondary-fixed-variant": "#464747",
                        "surface-container-low": "#f3f3f4",
                        "on-primary-container": "#848484",
                        "inverse-primary": "#c6c6c6",
                        "error-container": "#ffdad6",
                        "background": "#f9f9f9",
                        "secondary-fixed-dim": "#c7c6c6",
                        "on-primary": "#ffffff",
                        "tertiary-fixed-dim": "#c6c6c7",
                        "on-surface-variant": "#4c4546",
                        "surface-container": "#eeeeee",
                        "on-primary-fixed-variant": "#474747",
                        "on-primary-fixed": "#1b1b1b",
                        "error": "#ba1a1a",
                        "on-background": "#1a1c1c",
                        "secondary-fixed": "#e4e2e2",
                        "surface-variant": "#e2e2e2",
                        "on-secondary-container": "#626263",
                        "on-tertiary-container": "#838484",
                        "on-tertiary": "#ffffff",
                        "tertiary-container": "#1a1c1c",
                        "surface-container-high": "#e8e8e8",
                        "inverse-on-surface": "#f0f1f1",
                        "secondary-container": "#e1dfdf",
                        "on-error": "#ffffff",
                        "on-secondary-fixed": "#1b1c1c",
                        "outline-variant": "#cfc4c5",
                        "on-tertiary-fixed": "#1a1c1c",
                        "tertiary-fixed": "#e2e2e2",
                        "primary-fixed": "#e2e2e2",
                        "surface-dim": "#dadada",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary": "#ffffff",
                        "on-surface": "#1a1c1c",
                        "surface": "#f9f9f9",
                        "surface-tint": "#5e5e5e",
                        "inverse-surface": "#2f3131",
                        "outline": "#7e7576",
                        "tertiary": "#000000",
                        "primary": "#000000",
                        "primary-container": "#1b1b1b",
                        "on-tertiary-fixed-variant": "#454747"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "component-padding-x": "20px",
                        "gutter": "16px",
                        "stack-sm": "8px",
                        "container-margin": "24px",
                        "component-padding-y": "16px",
                        "stack-lg": "24px",
                        "section-gap": "40px",
                        "stack-md": "16px"
                    },
                    "fontFamily": {
                        "headline-md": ["Plus Jakarta Sans"],
                        "label-sm": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "display-lg-mobile": ["Plus Jakarta Sans"],
                        "title-lg": ["Plus Jakarta Sans"],
                        "label-lg": ["Plus Jakarta Sans"],
                        "display-lg": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "700"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "headline-lg": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "display-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "800"}],
                        "title-lg": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                        "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                        "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "800"}]
                    }
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-primary selection:bg-surface-container-highest selection:text-primary">
<!-- Main Content Canvas (Focused Journey: No Shell) -->
<main class="flex flex-col items-center justify-center min-h-screen w-full max-w-[390px] mx-auto px-container-margin relative overflow-hidden">
<!-- Subtle background texture for premium feel -->
<div class="absolute inset-0 opacity-20 pointer-events-none" style="background-image: radial-gradient(circle at 50% 50%, #1b1b1b 0%, #000000 100%);"></div>
<!-- Branding Header -->
<header class="mb-section-gap z-10 text-center">
<h1 class="font-headline-lg-mobile text-display-lg-mobile tracking-tighter text-on-primary">
                LNKICKS
            </h1>
<p class="font-label-lg text-label-lg text-on-primary-container tracking-widest mt-stack-sm opacity-60">
                ADMINISTRATION
            </p>
</header>
<!-- Login Form Container -->
<div class="w-full z-10 flex flex-col gap-stack-lg">
<!-- Welcome Text -->
<div class="mb-stack-md">
<h2 class="font-headline-md text-headline-md text-on-primary">Welcome back</h2>
<p class="font-body-md text-body-md text-on-primary-container opacity-50">Please enter your credentials to access the terminal.</p>
</div>
<form class="flex flex-col gap-stack-md">
<!-- Username Input -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-sm text-label-sm text-on-primary opacity-40 uppercase tracking-widest px-1" for="username">Username</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-primary-container opacity-40 text-[20px]" data-icon="person">person</span>
<input class="w-full h-[64px] pl-12 pr-4 bg-primary-container border border-outline/10 text-on-primary font-body-lg text-body-lg rounded-xl focus:outline-none focus:ring-1 focus:ring-on-primary/20 transition-all placeholder:text-on-primary/20" id="username" placeholder="Enter admin id" type="text">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-stack-sm">
<div class="flex justify-between items-center px-1">
<label class="font-label-sm text-label-sm text-on-primary opacity-40 uppercase tracking-widest" for="password">Password</label>
<a class="font-label-sm text-label-sm text-on-primary-container hover:text-on-primary transition-colors" href="#">Forgot?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-primary-container opacity-40 text-[20px]" data-icon="lock">lock</span>
<input class="w-full h-[64px] pl-12 pr-12 bg-primary-container border border-outline/10 text-on-primary font-body-lg text-body-lg rounded-xl focus:outline-none focus:ring-1 focus:ring-on-primary/20 transition-all placeholder:text-on-primary/20" id="password" placeholder="••••••••" type="password">
<button class="absolute right-4 text-on-primary-container opacity-40 hover:opacity-100 transition-opacity" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Primary Action -->
<button class="mt-stack-md w-full h-[64px] bg-on-primary text-primary font-title-lg text-title-lg rounded-full flex items-center justify-center gap-2 active:scale-[0.98] transition-transform shadow-[0px_10px_30px_rgba(255,255,255,0.05)]" type="submit">
                    Login
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Secondary Actions / Footer -->
<div class="mt-stack-lg flex flex-col items-center gap-stack-md">
<div class="flex items-center w-full gap-4">
<div class="h-[1px] flex-1 bg-on-primary/10"></div>
<span class="font-label-sm text-label-sm text-on-primary/30 uppercase tracking-[0.2em]">Security Check</span>
<div class="h-[1px] flex-1 bg-on-primary/10"></div>
</div>
<div class="flex gap-stack-md w-full">
<button class="flex-1 h-[56px] border border-outline/10 rounded-xl flex items-center justify-center gap-2 text-on-primary font-label-lg text-label-lg hover:bg-on-primary/5 transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="fingerprint">fingerprint</span>
                        Biometrics
                    </button>
<button class="flex-1 h-[56px] border border-outline/10 rounded-xl flex items-center justify-center gap-2 text-on-primary font-label-lg text-label-lg hover:bg-on-primary/5 transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="key">key</span>
                        SSO
                    </button>
</div>
</div>
</div>
<!-- Visual Footer / Compliance -->
<footer class="mt-section-gap mb-8 text-center z-10">
<p class="font-label-sm text-label-sm text-on-primary/20">
                Authorized Personnel Only. <br> 
                Session monitored for security purposes.
            </p>
</footer>
<!-- Decorative background elements -->
<div class="absolute -top-20 -right-20 w-64 h-64 bg-on-primary opacity-[0.02] rounded-full blur-[80px]"></div>
<div class="absolute -bottom-40 -left-20 w-96 h-96 bg-on-primary opacity-[0.03] rounded-full blur-[100px]"></div>
</main>
<script src="js/app.js"></script>
<script src="js/user_account_engine.js"></script>
</body></html>
