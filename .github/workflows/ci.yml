# CI workflow — continuous integration for every push and PR to main.
# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch when a new commit is pushed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege permissions. CI only needs to read the repo.
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Build & lint on a matrix of OS + Node versions
  # ─────────────────────────────────────────────────────────────────────
  build:
    name: Build & Lint (Node ${{ matrix.node }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false   # report all matrix failures, not just the first
      matrix:
        os: [ubuntu-latest]
        node: [22]   # match production (cPanel nodevenv uses Node 22)
                     # do NOT test on 20 — production is 22, so 20 builds are noise

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for any tooling that needs it
          persist-credentials: false

      - name: 🟢 Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json   # lockfile is more reliable than package.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint
        run: npm run lint
        continue-on-error: false

      - name: 🔍 Type-check (tsc --noEmit)
        run: npm run type-check
        continue-on-error: false

      - name: 🏗️ Build
        run: npm run build
        env:
          NODE_ENV: production
          # Next.js needs these even for static builds
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ secrets.NEXT_PUBLIC_WHATSAPP_NUMBER }}

      - name: 📊 Upload build artifact
        # Always upload — we now have a single matrix entry (Node 22).
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: .next/
          retention-days: 7
          if-no-files-found: error
          # .next/ is a hidden directory (leading dot); upload-artifact@v4
          # defaults to include-hidden-files: false, which would skip it
          # entirely and trigger if-no-files-found: error. Enable it.
          include-hidden-files: true

  # ─────────────────────────────────────────────────────────────────────
  # Security: scan for secrets that should never be committed
  # ─────────────────────────────────────────────────────────────────────
  secret-scan:
    name: 🔒 Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 🔍 TruffleHog OSS secret scan
        # Pinned to a specific major version (v3.88) instead of @main for
        # supply-chain safety — @main could change behavior or pull in
        # malicious code if the upstream repo were compromised.
        uses: trufflesecurity/trufflehog@v3.88.0
        with:
          path: .
          extra_args: --only-verified --results=verified,unknown

  # ─────────────────────────────────────────────────────────────────────
  # Optional gate — runs after build succeeds
  # ─────────────────────────────────────────────────────────────────────
  report:
    name: 📋 CI summary
    runs-on: ubuntu-latest
    needs: [build, secret-scan]
    if: always()
    timeout-minutes: 2

    steps:
      - name: Summarize
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Lint | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret scan  | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.build.result }}" != "success" || "${{ needs.secret-scan.result }}" != "success" ]]; then
            echo "❌ One or more CI jobs failed."
            exit 1
          fi
          echo "✅ All CI jobs passed."
