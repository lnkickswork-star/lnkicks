# Release workflow — automatically creates a GitHub Release when a tag is pushed.
# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions

name: Release

on:
  push:
    tags:
      - "v*"   # triggers on any tag matching v1.0.0, v2.1.3, etc.

# Releases need write access to create the release and upload assets.
permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Build the production artifact
  # ─────────────────────────────────────────────────────────────────────
  build:
    name: Build for release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Production build
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"

      - name: 📦 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: .next/
          retention-days: 30
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────
  # Create the GitHub Release
  # ─────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 📥 Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: release-build
          path: .next/

      - name: 🏷️ Extract version from tag
        id: version
        run: |
          # Tag format: refs/tags/v1.2.3
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG"          >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"
          echo "Extracted: tag=$TAG, version=$VERSION"

      - name: 📝 Build release notes from CHANGELOG.md
        id: notes
        run: |
          # Extract the section matching this version from CHANGELOG.md
          VERSION="${{ steps.version.outputs.version }}"
          # Try to find a section like "## [X.Y.Z] — YYYY-MM-DD"
          NOTES=$(awk -v v="$VERSION" '
            /^## \[/ {
              if (in_section) exit
              if (index($0, "[" v "]") > 0) { in_section = 1; next }
            }
            in_section { print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release ${VERSION}. See CHANGELOG.md for details."
          fi
          # Multi-line output via $GITHUB_OUTPUT file
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 📦 Zip the build
        run: |
          tar -czf lnkicks-${{ steps.version.outputs.version }}.tar.gz .next/
          ls -la lnkicks-*.tar.gz

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: lnkicks-${{ steps.version.outputs.version }}.tar.gz
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
