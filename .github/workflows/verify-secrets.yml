# =============================================================================
# Verify Secrets — Diagnostic Workflow
# =============================================================================
#
# Manual-trigger diagnostic that:
#   1. Checks all 9 required deploy secrets are present (length only, no values)
#   2. If all present, tries a real SSH connection to the server
#   3. Prints a clear ✅/❌ table to job summary
#
# Run: Repo → Actions → "Verify Secrets" → Run workflow → main
#
# This workflow NEVER prints secret values — only their lengths and whether
# they are set. Safe to share the run summary publicly.
# =============================================================================
name: Verify Secrets

on:
  workflow_dispatch:    # manual trigger only — never runs on push

permissions:
  contents: read

jobs:
  verify:
    name: 🔍 Check all deploy secrets are set
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # ---------------------------------------------------------------------
      # Step 1: Verify all 9 required secrets are PRESENT (non-empty).
      # We check length only — never print the value itself.
      # ---------------------------------------------------------------------
      - name: 🔍 Verify all 9 required secrets are present
        env:
          # Pass secrets via env to avoid bash injection from secret values.
          # Bash sees only env var references; values never touch the script.
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          APP_ROOT: ${{ secrets.APP_ROOT }}
          NODEVENV_PATH: ${{ secrets.NODEVENV_PATH }}
          PRODUCTION_DOMAIN: ${{ secrets.PRODUCTION_DOMAIN }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ secrets.NEXT_PUBLIC_WHATSAPP_NUMBER }}
        run: |
          {
            echo "## Secret verification"
            echo ""
            echo "| # | Secret | Status | Length |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          MISSING=0
          TOTAL=0

          # check_secret <num> <name> <value>
          # Prints one row to summary + one line to log. Increments MISSING if empty.
          check_secret() {
            local num="$1"
            local name="$2"
            local value="$3"
            TOTAL=$((TOTAL + 1))
            if [[ -n "$value" ]]; then
              echo "| $num | \`$name\` | ✅ set | ${#value} chars |" >> "$GITHUB_STEP_SUMMARY"
              echo "  ✅ $name → set (length: ${#value})"
            else
              echo "| $num | \`$name\` | ❌ MISSING | 0 |" >> "$GITHUB_STEP_SUMMARY"
              echo "  ❌ $name → MISSING"
              MISSING=$((MISSING + 1))
            fi
          }

          check_secret 1 "SSH_HOST"                    "$SSH_HOST"
          check_secret 2 "SSH_PORT"                    "$SSH_PORT"
          check_secret 3 "SSH_USER"                    "$SSH_USER"
          check_secret 4 "SSH_PRIVATE_KEY"             "$SSH_PRIVATE_KEY"
          check_secret 5 "APP_ROOT"                    "$APP_ROOT"
          check_secret 6 "NODEVENV_PATH"               "$NODEVENV_PATH"
          check_secret 7 "PRODUCTION_DOMAIN"           "$PRODUCTION_DOMAIN"
          check_secret 8 "NEXT_PUBLIC_SITE_URL"        "$NEXT_PUBLIC_SITE_URL"
          check_secret 9 "NEXT_PUBLIC_WHATSAPP_NUMBER" "$NEXT_PUBLIC_WHATSAPP_NUMBER"

          {
            echo ""
            if [[ "$MISSING" -eq 0 ]]; then
              echo "✅ **All $TOTAL secrets are present.** Ready for SSH connection test."
            else
              echo "❌ **$MISSING / $TOTAL secrets are MISSING.** Add them before deploying."
              echo ""
              echo "Add them at: Repo → Settings → Secrets and variables → Actions → New repository secret"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "=========================================="
          if [[ "$MISSING" -eq 0 ]]; then
            echo "✅ ALL $TOTAL SECRETS PRESENT — proceeding to SSH test"
            echo "=========================================="
          else
            echo "❌ $MISSING / $TOTAL SECRETS MISSING — aborting SSH test"
            echo "=========================================="
            exit 1
          fi

      # ---------------------------------------------------------------------
      # Step 2: Real SSH connection test — only runs if all secrets present.
      # Verifies: key is valid, host is reachable, authorized_keys has the
      # matching public key, and APP_ROOT exists on the server.
      # ---------------------------------------------------------------------
      - name: 🔐 Test SSH connection to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          APP_ROOT: ${{ secrets.APP_ROOT }}
          NODEVENV_PATH: ${{ secrets.NODEVENV_PATH }}
        run: |
          set +e   # don't exit on first failure — we want to capture the result
          echo "Testing SSH connection to ${SSH_USER}@${SSH_HOST}:${SSH_PORT}..."
          echo "(Target APP_ROOT: ${APP_ROOT})"
          echo ""

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write private key — use printf to avoid trailing newline issues.
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Pre-populate known_hosts so we don't get an interactive prompt.
          # This also fails fast if the host is unreachable.
          echo "→ Scanning server host key..."
          if ! ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "❌ ssh-keyscan failed — host '$SSH_HOST' may be unreachable or port $SSH_PORT closed."
            {
              echo "## SSH connection test"
              echo ""
              echo "❌ \`ssh-keyscan\` failed — host unreachable or wrong port."
              echo ""
              echo "- Verify \`SSH_HOST\` (got: \`${SSH_HOST}\`)"
              echo "- Verify \`SSH_PORT\` (got: \`${SSH_PORT}\`)"
              echo "- Confirm your hosting provider allows SSH from GitHub Actions IPs"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ Host key added to known_hosts."
          echo ""

          # Attempt actual SSH connection with 20s timeout.
          echo "→ Attempting SSH login..."
          SSH_OUTPUT=$(ssh -p "$SSH_PORT" -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o PasswordAuthentication=no \
            -o PubkeyAuthentication=yes \
            -o IdentitiesOnly=yes \
            "${SSH_USER}@${SSH_HOST}" \
            'echo "SSH_OK"; whoami; pwd; echo "---"; test -d "'"${APP_ROOT}"'" && echo "APP_ROOT exists: '"${APP_ROOT}"'" || echo "APP_ROOT MISSING: '"${APP_ROOT}"'"; test -f "'"${NODEVENV_PATH}"'" && echo "NODEVENV_PATH exists" || echo "NODEVENV_PATH MISSING"' 2>&1)
          SSH_EXIT=$?

          if [[ $SSH_EXIT -eq 0 ]]; then
            echo "✅ SSH login successful. Server responded:"
            echo "$SSH_OUTPUT" | sed 's/^/  /'
            {
              echo "## SSH connection test"
              echo ""
              echo "✅ Successfully connected to \`${SSH_USER}@${SSH_HOST}:${SSH_PORT}\`"
              echo ""
              echo '```'
              echo "$SSH_OUTPUT"
              echo '```'
              echo ""
              echo "Ready to run the deploy workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          else
            echo "❌ SSH login failed. Exit code: $SSH_EXIT"
            echo "Server response / error:"
            echo "$SSH_OUTPUT" | sed 's/^/  /'
            echo ""
            {
              echo "## SSH connection test"
              echo ""
              echo "❌ SSH connection to \`${SSH_USER}@${SSH_HOST}:${SSH_PORT}\` FAILED (exit $SSH_EXIT)."
              echo ""
              echo '```'
              echo "$SSH_OUTPUT"
              echo '```'
              echo ""
              echo "### Likely causes & fixes"
              echo ""
              echo "1. **Wrong key type** — \`SSH_PRIVATE_KEY\` may be the old RSA passphrase-protected key. Generate a fresh ed25519 key:"
              echo ""
              echo "   \`\`\`bash"
              echo "   ssh -p ${SSH_PORT} ${SSH_USER}@${SSH_HOST}"
              echo "   ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N \"\" -C \"github-actions-deploy\""
              echo "   cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys"
              echo "   chmod 600 ~/.ssh/authorized_keys"
              echo "   cat ~/.ssh/id_ed25519   # ← paste ENTIRE output into SSH_PRIVATE_KEY"
              echo "   \`\`\`"
              echo ""
              echo "2. **Public key not in authorized_keys** — on server: \`cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys\`"
              echo ""
              echo "3. **Wrong SSH_PORT** — got \`${SSH_PORT}\`. cPanel shared hosts sometimes use 2222/7822/21098."
              echo ""
              echo "4. **Firewall** — ask your host to whitelist GitHub Actions IP ranges:"
              echo "   https://docs.github.com/en/actions/reference/runners/github-hosted-runners#ip-addresses"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # ---------------------------------------------------------------------
      # Step 3: Final summary — always runs, even on failure (via if: always())
      # ---------------------------------------------------------------------
      - name: 📋 Final verification summary
        if: always()
        run: |
          {
            echo ""
            echo "## Final status"
            echo ""
            echo "| Step | Result |"
            echo "|------|--------|"
            echo "| Secrets present | ${{ (job.status == 'success' || job.status == 'failure') && 'see table above' || 'skipped' }} |"
            echo "| SSH connection   | ${{ job.status == 'success' && '✅ passed' || '❌ failed' }} |"
            echo ""
            echo "Run the **Deploy to Production (cPanel)** workflow to deploy."
          } >> "$GITHUB_STEP_SUMMARY"
