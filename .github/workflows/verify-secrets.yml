# =============================================================================
# Verify GitHub Secrets — Diagnostic Workflow
# =============================================================================
#
# This workflow checks that all 9 secrets required for the deploy pipeline
# are present and non-empty. It does NOT print secret values — only whether
# each one is set or missing.
#
# Run manually: Repo → Actions → "Verify Secrets" → Run workflow → main
#
# After the run completes, the job summary will show a table like:
#   ✅ SSH_HOST                set (length: 22)
#   ✅ SSH_PORT                set (length: 2)
#   ❌ SSH_PRIVATE_KEY         MISSING
#   ✅ SSH_USER                set (length: 8)
#   ...
#
# Once all 9 show ✅, the deploy workflow has everything it needs.
# =============================================================================
name: Verify Secrets

on:
  workflow_dispatch:    # manual trigger only

permissions:
  contents: read

jobs:
  verify:
    name: 🔍 Check all deploy secrets are set
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 🔍 Verify all 9 required secrets are present
        run: |
          echo "## Secret verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| # | Secret | Status | Length |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY

          MISSING=0

          check_secret() {
            local num="$1"
            local name="$2"
            local val="${3:-}"
            if [[ -n "$val" ]]; then
              echo "| $num | \`$name\` | ✅ set | ${#val} chars |" >> $GITHUB_STEP_SUMMARY
              echo "  ✅ $name  → set (length: ${#val})"
            else
              echo "| $num | \`$name\` | ❌ MISSING | 0 |" >> $GITHUB_STEP_SUMMARY
              echo "  ❌ $name  → MISSING"
              MISSING=$((MISSING + 1))
            fi
          }

          check_secret 1 "SSH_HOST"                  "${{ secrets.SSH_HOST }}"
          check_secret 2 "SSH_PORT"                  "${{ secrets.SSH_PORT }}"
          check_secret 3 "SSH_USER"                  "${{ secrets.SSH_USER }}"
          check_secret 4 "SSH_PRIVATE_KEY"           "${{ secrets.SSH_PRIVATE_KEY }}"
          check_secret 5 "APP_ROOT"                  "${{ secrets.APP_ROOT }}"
          check_secret 6 "NODEVENV_PATH"             "${{ secrets.NODEVENV_PATH }}"
          check_secret 7 "PRODUCTION_DOMAIN"         "${{ secrets.PRODUCTION_DOMAIN }}"
          check_secret 8 "NEXT_PUBLIC_SITE_URL"      "${{ secrets.NEXT_PUBLIC_SITE_URL }}"
          check_secret 9 "NEXT_PUBLIC_WHATSAPP_NUMBER" "${{ secrets.NEXT_PUBLIC_WHATSAPP_NUMBER }}"

          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "$MISSING" -eq 0 ]]; then
            echo "✅ **All 9 secrets are present.** You're ready to run the deploy workflow." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ Note: This only verifies the secrets EXIST, not that their VALUES are correct." >> $GITHUB_STEP_SUMMARY
            echo "If SSH connection still fails, double-check:" >> $GITHUB_STEP_SUMMARY
            echo "- \`SSH_HOST\` matches your cPanel hostname (from screenshot: \`s1-nnvp.crazydns.com\`)" >> $GITHUB_STEP_SUMMARY
            echo "- \`SSH_PRIVATE_KEY\` is the NEW ed25519 key (not the old leaked RSA key)" >> $GITHUB_STEP_SUMMARY
            echo "- Server's \`~/.ssh/authorized_keys\` contains the new public key" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Next step: Actions → **Deploy to Production (cPanel)** → Run workflow" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **$MISSING secret(s) are missing.** Add them in:" >> $GITHUB_STEP_SUMMARY
            echo "Repo → Settings → Secrets and variables → Actions → New repository secret" >> $GITHUB_STEP_SUMMARY
          fi
          echo ""
          echo "=========================================="
          if [[ "$MISSING" -eq 0 ]]; then
            echo "✅ ALL 9 SECRETS PRESENT — ready to deploy"
            echo "=========================================="
            exit 0
          else
            echo "❌ $MISSING / 9 SECRETS MISSING — add them then re-run"
            echo "=========================================="
            exit 1
          fi

      - name: 🔐 Try SSH connection (only if all secrets present)
        if: success()
        run: |
          echo "Testing SSH connection to ${{ secrets.SSH_HOST }}:${{ secrets.SSH_PORT }} as ${{ secrets.SSH_USER }}..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

          # Try SSH with 15s timeout
          if ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/deploy_key \
               -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
               ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "echo SSH_OK; whoami; pwd; ls -la \${{ secrets.APP_ROOT }}/.next 2>/dev/null | head -5 || echo 'APP_ROOT not yet populated'"; then
            echo ""
            echo "=========================================="
            echo "✅ SSH CONNECTION SUCCESSFUL"
            echo "=========================================="
            echo "## SSH connection test" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ Successfully connected to \`${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_PORT }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Ready to run the deploy workflow." >> $GITHUB_STEP_SUMMARY
          else
            echo ""
            echo "=========================================="
            echo "❌ SSH CONNECTION FAILED"
            echo "=========================================="
            echo "Likely causes:"
            echo "1. SSH_PRIVATE_KEY is the OLD passphrase-protected RSA key (generate NEW ed25519)"
            echo "2. New public key not in server's ~/.ssh/authorized_keys"
            echo "3. SSH_HOST or SSH_PORT is wrong"
            echo "4. Server firewall blocking GitHub Actions IPs"
            echo ""
            echo "## SSH connection test" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ SSH connection to \`${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_PORT }}\` FAILED." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Likely causes:" >> $GITHUB_STEP_SUMMARY
            echo "1. \`SSH_PRIVATE_KEY\` is the OLD passphrase-protected RSA key — generate NEW ed25519 key on server:" >> $GITHUB_STEP_SUMMARY
            echo '   ```bash' >> $GITHUB_STEP_SUMMARY
            echo '   ssh -p 22 aqualit1@s1-nnvp.crazydns.com' >> $GITHUB_STEP_SUMMARY
            echo '   ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N "" -C "github-actions-deploy@lnkicks"' >> $GITHUB_STEP_SUMMARY
            echo '   cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys' >> $GITHUB_STEP_SUMMARY
            echo '   chmod 600 ~/.ssh/authorized_keys' >> $GITHUB_STEP_SUMMARY
            echo '   cat ~/.ssh/id_ed25519  # ← paste this into SSH_PRIVATE_KEY secret' >> $GITHUB_STEP_SUMMARY
            echo '   ```' >> $GITHUB_STEP_SUMMARY
            echo "2. New public key not added to server's \`~/.ssh/authorized_keys\`" >> $GITHUB_STEP_SUMMARY
            echo "3. \`SSH_HOST\` or \`SSH_PORT\` is wrong (host: \`s1-nnvp.crazydns.com\`, port: \`22\`)" >> $GITHUB_STEP_SUMMARY
            echo "4. Server firewall blocking GitHub Actions IPs (ask host to whitelist GitHub IP ranges)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
