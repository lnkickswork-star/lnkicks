# =============================================================================
# Production Deployment Workflow — LN KICKS Next.js → cPanel via FTP
# =============================================================================

name: Deploy to Production (cPanel FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  build-and-deploy:
    name: 🚀 Build & Deploy via FTP
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Type-check & Lint
        run: |
          npm run type-check
          npm run lint

      - name: 🏗️ Production Build (Next.js)
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ secrets.NEXT_PUBLIC_WHATSAPP_NUMBER }}

      - name: 🔐 Create Production .env File
        run: |
          cat <<EOF > .env
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          DIRECT_URL=${{ secrets.DIRECT_URL }}
          NODE_ENV=production
          NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_WHATSAPP_NUMBER=${{ secrets.NEXT_PUBLIC_WHATSAPP_NUMBER }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          ADMIN_JWT_SECRET=${{ secrets.ADMIN_JWT_SECRET }}
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          EOF

      - name: 🔄 Create App Restart Trigger
        run: |
          mkdir -p tmp
          touch tmp/restart.txt

      - name: 📂 Prepare Files for FTP Transfer
        run: |
          mkdir deploy-folder
          cp -r .next deploy-folder/
          cp -r public deploy-folder/
          cp next.config.js deploy-folder/
          cp package.json deploy-folder/
          cp package-lock.json deploy-folder/
          cp .env deploy-folder/
          cp -r tmp deploy-folder/
          
          # Optional files (ignore if not present)
          cp cpanel/app.js deploy-folder/ || true

      - name: 📤 Upload to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy-folder/
          server-dir: /lnkicks.in/ # ध्यान रहे, FTP अकाउंट सीधा उसी फोल्डर पर पॉइंट करे जहाँ वेबसाइट है

      - name: ✅ Deployment Summary
        if: success()
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## ✅ FTP Deployment Successful
          - ✅ Build Successful
          - ✅ Files Uploaded via FTP
          - ✅ .env File Generated and Uploaded
          - ✅ Passenger Restart Triggered
          EOF
