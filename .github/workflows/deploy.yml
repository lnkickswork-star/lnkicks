# =============================================================================
# Production Deployment Workflow — LN KICKS Next.js → cPanel Node.js
# =============================================================================
#
# Triggered automatically on every push to `main` (after ci.yml passes),
# and manually via the GitHub Actions "Run workflow" button.
#
# Pipeline stages:
#   1. quality-gate      — type-check + lint + build (aborts deploy on failure)
#   2. prepare-artifact  — bundle only the files cPanel needs into a tarball
#   3. deploy            — upload via rsync over SSH, install prod deps,
#                          restart Node.js app, verify health
#   4. rollback          — automatic if health check fails after restart
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST              — cPanel server hostname (e.g. sharedXX.hosting.com)
#   SSH_PORT              — SSH port (usually 22, sometimes 2222 on shared hosts)
#   SSH_USER              — cPanel username (e.g. aqualit1)
#   SSH_PRIVATE_KEY       — contents of the PRIVATE key (the file you generated
#                           on the server at ~/.ssh/id_ed25519 — copy its contents
#                           into this secret, including the BEGIN/END lines).
#                           MUST be a passphrase-less ed25519 key (RSA also works
#                           but ed25519 is preferred — smaller, faster, modern).
#   APP_ROOT              — absolute path on server (e.g. /home/aqualit1/lnkicks)
#                           NOTE: code deploys DIRECTLY to this path (no /current
#                           subdir). Backups live in $HOME/lnkicks-releases/.
#   NODEVENV_PATH         — absolute path to cPanel's nodevenv activate script
#                           (e.g. /home/aqualit1/nodevenv/lnkicks/22/bin/activate)
#                           — sourced before every npm/node command on server.
#   PRODUCTION_DOMAIN     — your live domain (e.g. https://lnkicks.com)
#   NEXT_PUBLIC_SITE_URL  — public site URL (same as PRODUCTION_DOMAIN without
#                           trailing slash). Required at BUILD time for Next.js
#                           to bake correct metadata/OG tags into the bundle.
#
# Optional secrets (set if your build needs them at build time):
#   NEXT_PUBLIC_WHATSAPP_NUMBER, NEXT_PUBLIC_GA_ID, etc.
#   Any NEXT_PUBLIC_* var that the app reads at build time must be added here.
#
# Server-side env vars (NOT in GitHub Secrets):
#   Runtime-only secrets (DB passwords, payment gateway keys, JWT secrets,
#   etc.) must be set in cPanel UI → Setup Node.js App → Environment vars.
#   They are NOT needed at build time and should NOT live in git.
# =============================================================================

name: Deploy to Production (cPanel)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_rollback:
        description: 'Roll back to the previous deployment instead of deploying new code'
        required: false
        type: boolean
        default: false

# Only one deployment at a time — concurrent deploys would corrupt the
# rsync target. New push cancels any in-flight deploy and starts fresh.
concurrency:
  group: deploy-production
  cancel-in-progress: false   # NEVER cancel mid-deploy — could leave prod broken

# Least-privilege: deployment only needs to read the repo and talk to the
# server over SSH. No GitHub API writes needed.
permissions:
  contents: read

env:
  # MUST match the Node.js version configured in cPanel → Setup Node.js App.
  # The server's nodevenv path (/home/aqualit1/nodevenv/lnkicks/22/) confirms
  # Node 22 is in use. Changing this without updating cPanel will cause
  # build/runtime mismatch issues.
  NODE_VERSION: '22'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # ---------------------------------------------------------------------------
  # 1. QUALITY GATE — Build + lint + type-check. Abort deploy on any failure.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: 🔍 Quality Gate (type-check + lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      commit_sha: ${{ github.sha }}
      commit_short: ${{ steps.meta.outputs.short_sha }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🟢 Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 📦 Install dependencies (npm ci)
        run: npm ci

      - name: 🔍 Type-check (tsc --noEmit)
        run: npm run type-check

      - name: 🧹 Lint (next lint)
        run: npm run lint

      - name: 🏗️ Production build (next build)
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ secrets.NEXT_PUBLIC_WHATSAPP_NUMBER }}

      - name: 🏷️ Build metadata
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "Deploying commit $SHORT_SHA" >> $GITHUB_STEP_SUMMARY
          echo "Build timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

      - name: 📦 Upload build artifact (for deploy job)
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: |
            .next/
            public/
            next.config.js
            package.json
            package-lock.json
            cpanel/app.js
            cpanel/.cpanel.yml
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: true

  # ---------------------------------------------------------------------------
  # 2. ROLLBACK (manual trigger only) — skip deploy, restore last good version
  # ---------------------------------------------------------------------------
  rollback:
    name: ⏪ Rollback to previous deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.force_rollback == true
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 🔐 Load SSH key
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "❌ ssh-keyscan failed — host '${SSH_HOST}' unreachable or port ${SSH_PORT} closed."
            exit 1
          fi

      - name: ⏪ Execute rollback on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          APP_ROOT: ${{ secrets.APP_ROOT }}
          NODEVENV_PATH: ${{ secrets.NODEVENV_PATH }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -p "$SSH_PORT" -i ~/.ssh/deploy_key \
            -o BatchMode=yes -o ConnectTimeout=15 \
            "${SSH_USER}@${SSH_HOST}" \
            "bash '${APP_ROOT}/scripts/deploy/rollback.sh' \
              '${APP_ROOT}' \
              'manual-rollback' \
              '\$HOME/lnkicks-releases' \
              '${NODEVENV_PATH}'"

      - name: 🩺 Post-rollback health check
        env:
          PRODUCTION_DOMAIN: ${{ secrets.PRODUCTION_DOMAIN }}
        run: |
          bash scripts/deploy/health-check.sh "$PRODUCTION_DOMAIN" 60

  # ---------------------------------------------------------------------------
  # 3. DEPLOY — Upload artifact, install deps, restart, verify health
  # ---------------------------------------------------------------------------
  deploy:
    name: 🚀 Deploy to cPanel
    needs: quality-gate
    # Skip deploy when the user triggered a manual rollback. Secret presence
    # is verified inside the "Verify all required secrets are set" step below,
    # which fails with a clear, actionable error message listing any missing
    # secrets. That step runs in a standards-compliant context (env: + run:).
    #
    # NOTE: The `secrets` context is NOT allowed in job-level `if:` per the
    # GitHub Actions spec — only `github`, `inputs`, `needs`, and `vars` are.
    # GitHub's parser is currently lenient and accepts `secrets.*` here, but
    # actionlint and the official docs flag it as invalid. We therefore moved
    # the presence-check out of `if:` and into the step-level verify step.
    if: |
      (github.event_name != 'workflow_dispatch' || inputs.force_rollback == false)
    runs-on: ubuntu-latest
    environment:
      name: production
      # `environment.url` does NOT support the `secrets` context — only
      # `github`, `inputs`, and `vars` are allowed here. Referencing
      # `secrets.PRODUCTION_DOMAIN` causes GitHub's parser to fail with:
      #     "Unrecognized named-value: 'secrets'"
      # Workaround: use `vars.PRODUCTION_DOMAIN` (a non-secret repository
      # Variable — URLs are public information, not secrets) with a hardcoded
      # fallback so the workflow runs even if the Variable is not set. The
      # deployment URL is also echoed in the final "Deployment summary" step.
      url: ${{ vars.PRODUCTION_DOMAIN || 'https://lnkicks.in' }}
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout (for deployment scripts)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 🔍 Verify all required secrets are set (fail fast with clear message)
        env:
          # Pass secrets via env to avoid bash injection from secret values.
          # Bash sees only env var references; values never touch the script.
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          APP_ROOT: ${{ secrets.APP_ROOT }}
          NODEVENV_PATH: ${{ secrets.NODEVENV_PATH }}
          PRODUCTION_DOMAIN: ${{ secrets.PRODUCTION_DOMAIN }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ secrets.NEXT_PUBLIC_WHATSAPP_NUMBER }}
        run: |
          set -euo pipefail
          MISSING=0
          # Check each secret via env var reference (NOT direct interpolation).
          for kv in \
            "SSH_HOST=${SSH_HOST}" \
            "SSH_PORT=${SSH_PORT}" \
            "SSH_USER=${SSH_USER}" \
            "SSH_PRIVATE_KEY=${SSH_PRIVATE_KEY}" \
            "APP_ROOT=${APP_ROOT}" \
            "NODEVENV_PATH=${NODEVENV_PATH}" \
            "PRODUCTION_DOMAIN=${PRODUCTION_DOMAIN}" \
            "NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}" \
            "NEXT_PUBLIC_WHATSAPP_NUMBER=${NEXT_PUBLIC_WHATSAPP_NUMBER}"; do
            name="${kv%%=*}"
            value="${kv#*=}"
            if [[ -z "$value" ]]; then
              echo "❌ $name is missing"
              MISSING=$((MISSING+1))
            else
              echo "✅ $name is set (length: ${#value})"
            fi
          done
          if [[ "$MISSING" -gt 0 ]]; then
            echo ""
            echo "=========================================="
            echo "❌ $MISSING / 9 required secrets are MISSING."
            echo "=========================================="
            echo "Add them in: Repo → Settings → Secrets and variables → Actions → New repository secret"
            echo "Once added, re-run this workflow OR push a new commit."
            echo ""
            echo "Reference values (from cPanel screenshot):"
            echo "  SSH_HOST              = s1-nnvp.crazydns.com"
            echo "  SSH_PORT              = 22"
            echo "  SSH_USER              = aqualit1"
            echo "  SSH_PRIVATE_KEY       = (output of: cat ~/.ssh/id_ed25519)"
            echo "  APP_ROOT              = /home/aqualit1/lnkicks"
            echo "  NODEVENV_PATH         = /home/aqualit1/nodevenv/lnkicks/22/bin/activate"
            echo "  PRODUCTION_DOMAIN     = https://lnkicks.in"
            echo "  NEXT_PUBLIC_SITE_URL  = https://lnkicks.in"
            echo "  NEXT_PUBLIC_WHATSAPP_NUMBER = 918881286267"
            exit 1
          fi
          echo ""
          echo "✅ All 9 required secrets are present."

      - name: 📦 Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: .

      - name: 📋 Verify artifact contents
        run: |
          echo "=== Artifact contents ==="
          ls -lah
          echo "=== .next/ exists? ==="
          test -d .next && echo "OK: .next/ present" || { echo "FAIL: .next/ missing"; exit 1; }
          echo "=== cpanel/app.js exists? ==="
          test -f cpanel/app.js && echo "OK: cpanel/app.js present" || { echo "FAIL: cpanel/app.js missing"; exit 1; }
          echo "=== package.json exists? ==="
          test -f package.json && echo "OK: package.json present" || { echo "FAIL: package.json missing"; exit 1; }
          echo "=== Standalone server file in .next? ==="
          ls .next/BUILD_ID && echo "OK: BUILD_ID present (build succeeded)" || exit 1

      - name: 🔐 Load SSH key & verify connection
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          APP_ROOT: ${{ secrets.APP_ROOT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Use printf to avoid trailing-newline issues; never echo the key.
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Fail fast if the server is unreachable or port is closed.
          echo "→ Scanning server host key (${SSH_HOST}:${SSH_PORT})..."
          if ! ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "❌ ssh-keyscan failed — host '${SSH_HOST}' unreachable or port ${SSH_PORT} closed."
            exit 1
          fi
          echo "✅ Host key added to known_hosts."

          # Verify SSH login works with the supplied key.
          echo "→ Verifying SSH login..."
          ssh -p "$SSH_PORT" -i ~/.ssh/deploy_key \
            -o BatchMode=yes -o ConnectTimeout=15 \
            -o PasswordAuthentication=no -o PubkeyAuthentication=yes -o IdentitiesOnly=yes \
            "${SSH_USER}@${SSH_HOST}" "echo SSH_OK; whoami; pwd; test -d '${APP_ROOT}' && echo APP_ROOT_OK || echo APP_ROOT_MISSING"

      - name: 📦 Ensure remote directories exist
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          APP_ROOT: ${{ secrets.APP_ROOT }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -p "$SSH_PORT" -i ~/.ssh/deploy_key -o BatchMode=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "mkdir -p '${APP_ROOT}' \
             \$HOME/lnkicks-releases \
             '${APP_ROOT}/tmp' \
             '${APP_ROOT}/scripts/deploy'"

      - name: 📤 Upload deployment scripts to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          APP_ROOT: ${{ secrets.APP_ROOT }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          rsync -azP --delete \
            -e "ssh -p ${SSH_PORT} -i ~/.ssh/deploy_key -o BatchMode=yes" \
            scripts/deploy/ \
            "${SSH_USER}@${SSH_HOST}:${APP_ROOT}/scripts/deploy/"
          # Make scripts executable
          ssh -p "$SSH_PORT" -i ~/.ssh/deploy_key -o BatchMode=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "chmod +x '${APP_ROOT}/scripts/deploy/'*.sh"

      - name: 💾 Backup current production (for rollback)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          APP_ROOT: ${{ secrets.APP_ROOT }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -p "$SSH_PORT" -i ~/.ssh/deploy_key -o BatchMode=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "bash '${APP_ROOT}/scripts/deploy/backup-current.sh' \
              '${APP_ROOT}' \
              '${GIT_SHA}' \
              '\$HOME/lnkicks-releases'"

      - name: 📤 Upload production files via rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          APP_ROOT: ${{ secrets.APP_ROOT }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Upload ONLY the files cPanel needs to run the app. Code is placed
          # DIRECTLY in $APP_ROOT (no /current subdir) — matches the cPanel
          # app root configured by the user.
          #
          # Files included:
          #   .next/           — compiled build
          #   public/          — static assets
          #   next.config.js   — Next.js config
          #   package.json     — for npm ci
          #   package-lock.json— for npm ci
          #   cpanel/app.js    — Passenger entry point
          #
          # We deliberately EXCLUDE:
          #   node_modules/   — installed on server via npm ci --omit=dev
          #   .git/           — not needed in production
          #   prototypes/     — dev-only HTML mockups
          #   docs/           — not needed at runtime
          #   agent-ctx/      — dev-only context files
          #   scripts/        — deployed separately (deploy scripts)
          #   releases/       — backups live OUTSIDE app root now
          #   tmp/            — Passenger restart dir, do not overwrite
          #   *.md            — not needed at runtime
          #   .github/        — CI config, not needed at runtime
          #   .env*           — env vars managed via nodevenv etc/envvars
          rsync -azP --delete \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='prototypes' \
            --exclude='docs' \
            --exclude='agent-ctx' \
            --exclude='scripts' \
            --exclude='releases' \
            --exclude='tmp' \
            --exclude='*.md' \
            --exclude='.env*' \
            --exclude='.vscode' \
            --exclude='.idea' \
            --exclude='tsconfig.json' \
            --exclude='next-env.d.ts' \
            --exclude='.eslintrc*' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='tsconfig.tsbuildinfo' \
            --exclude='bun.lock' \
            --exclude='vercel.json' \
            --exclude='.editorconfig' \
            --exclude='.npmrc' \
            --exclude='.yarnrc' \
            -e "ssh -p ${SSH_PORT} -i ~/.ssh/deploy_key -o BatchMode=yes" \
            ./ \
            "${SSH_USER}@${SSH_HOST}:${APP_ROOT}/"

      - name: 📦 Install production dependencies on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          APP_ROOT: ${{ secrets.APP_ROOT }}
          NODEVENV_PATH: ${{ secrets.NODEVENV_PATH }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Sources the nodevenv activate script (sets PATH to Node 22 + npm)
          # before running npm ci. Without this, cPanel's default Node would
          # be used and the install would fail.
          ssh -p "$SSH_PORT" -i ~/.ssh/deploy_key -o BatchMode=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "bash '${APP_ROOT}/scripts/deploy/install-deps.sh' \
              '${APP_ROOT}' \
              '${NODEVENV_PATH}'"

      - name: 🔴 Restart Node.js application (Passenger)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          APP_ROOT: ${{ secrets.APP_ROOT }}
          NODEVENV_PATH: ${{ secrets.NODEVENV_PATH }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Touches tmp/restart.txt inside app root — Passenger watches this
          # file and gracefully restarts on next request.
          ssh -p "$SSH_PORT" -i ~/.ssh/deploy_key -o BatchMode=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "bash '${APP_ROOT}/scripts/deploy/restart.sh' \
              '${APP_ROOT}' \
              '${NODEVENV_PATH}'"

      - name: 🩺 Health check (post-deploy verification)
        id: health
        env:
          PRODUCTION_DOMAIN: ${{ secrets.PRODUCTION_DOMAIN }}
        run: |
          bash scripts/deploy/health-check.sh "$PRODUCTION_DOMAIN" 90
        continue-on-error: true

      - name: ⏪ Auto-rollback if health check failed
        if: steps.health.outcome == 'failure'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          APP_ROOT: ${{ secrets.APP_ROOT }}
          NODEVENV_PATH: ${{ secrets.NODEVENV_PATH }}
          PRODUCTION_DOMAIN: ${{ secrets.PRODUCTION_DOMAIN }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "❌ Health check FAILED after deployment. Initiating automatic rollback..."
          ssh -p "$SSH_PORT" -i ~/.ssh/deploy_key -o BatchMode=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "bash '${APP_ROOT}/scripts/deploy/rollback.sh' \
              '${APP_ROOT}' \
              '${GIT_SHA}' \
              '\$HOME/lnkicks-releases' \
              '${NODEVENV_PATH}'"

          echo "⏳ Waiting 20s for rollback to take effect..."
          sleep 20

          echo "🩺 Re-checking health after rollback..."
          if bash scripts/deploy/health-check.sh "$PRODUCTION_DOMAIN" 60; then
            echo "✅ Rollback successful — production is healthy again with previous version."
          else
            echo "🚨 CRITICAL: Rollback ALSO failed. Production is BROKEN. Manual intervention required."
            echo "Check server logs at: /home/${SSH_USER}/logs/"
            exit 1
          fi
          exit 1   # fail the workflow so the team knows deploy failed

      - name: ✅ Deployment summary
        if: success()
        env:
          PRODUCTION_DOMAIN: ${{ secrets.PRODUCTION_DOMAIN }}
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## ✅ Deployment Successful

          | Field | Value |
          |-------|-------|
          | Commit | \`${{ needs.quality-gate.outputs.commit_short }}\` |
          | Branch | \`main\` |
          | Environment | production |
          | URL | ${PRODUCTION_DOMAIN} |
          | Deployed at | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |

          ### Verified
          - ✅ Type-check passed
          - ✅ Lint passed
          - ✅ Production build succeeded
          - ✅ Files uploaded via rsync
          - ✅ Production dependencies installed (\`npm ci --omit=dev\`)
          - ✅ Node.js app restarted
          - ✅ Health check passed (HTTP 200 on homepage)

          ### Rollback
          Previous version backed up to \`$HOME/lnkicks-releases/\`.
          To roll back manually, run the workflow with **force_rollback=true**.
          EOF
