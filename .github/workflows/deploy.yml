# =============================================================================
# Production Deployment Workflow — LN KICKS Next.js → cPanel via FTP
# =============================================================================
#
# Pipeline (single job, GitHub-hosted ubuntu-latest runner):
#   1. Checkout
#   2. Setup Node 22 (matches cPanel nodevenv)
#   3. npm ci        — reproducible install from package-lock.json
#   4. type-check + lint + build  — abort deploy on any failure
#   5. Generate .env from GitHub Secrets (indented heredoc → unindented vars)
#   6. Stage files for FTP transfer in ./deploy-folder/
#   7. Verify all required FTP secrets are present (fail fast, clear message)
#   8. Upload via FTP with retry + timeout + passive mode + .ftpignore
#   9. Touch tmp/restart.txt → Passenger auto-restarts on next request
#
# Why a single job (not split build/upload):
#   GitHub-hosted runners occasionally fail to allocate ("job was not acquired
#   by Runner of type hosted"). Splitting into 2 jobs DOUBLES the chance of
#   hitting that infrastructure error and DOUBLES the queue wait. One job is
#   the most reliable shape for this repo's traffic profile.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER                  — cPanel FTP hostname (e.g. s1-nnvp.crazzydns.com)
#   FTP_USERNAME                — cPanel FTP username (e.g. aqualit1@lnkicks.in)
#   FTP_PASSWORD                — cPanel FTP password
#   DATABASE_URL                — postgresql://... (Neon pooled, ?sslmode=require)
#   DIRECT_URL                  — postgresql://... (Neon direct, ?sslmode=require)
#   NEXT_PUBLIC_SITE_URL        — https://lnkicks.in
#   NEXT_PUBLIC_WHATSAPP_NUMBER — 918881286267
#   JWT_SECRET                  — openssl rand -base64 48
#   ADMIN_JWT_SECRET            — openssl rand -base64 48
#   SESSION_SECRET              — openssl rand -base64 48
# =============================================================================

name: Deploy to Production (cPanel FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deployment at a time. New push waits for the in-flight deploy
# to finish (cancel-in-progress: false) — killing a deploy mid-upload
# leaves the FTP target in a half-synced state.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Least-privilege: deploy only reads the repo. No GITHUB_TOKEN writes needed.
permissions:
  contents: read

env:
  NODE_VERSION: '22'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  build-and-deploy:
    name: 🚀 Build & Deploy via FTP
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 🟢 Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 📦 Install dependencies (npm ci)
        run: npm ci

      - name: 🔍 Type-check (tsc --noEmit)
        run: npm run type-check

      - name: 🧹 Lint (next lint)
        run: npm run lint

      - name: 🏗️ Production build (next build)
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ secrets.NEXT_PUBLIC_WHATSAPP_NUMBER }}

      # ─────────────────────────────────────────────────────────────────────
      # Generate .env for the server.
      #
      # CRITICAL: use `<<'ENVEOF'` (quoted) so GitHub Actions does NOT
      # interpolate ${VAR} inside the heredoc body — we want the SHELL to
      # interpolate them after the env: block injects the secrets as real
      # shell variables. Using ${{ secrets.X }} directly in the heredoc
      # would also work but exposes the secret value in the workflow run
      # log if the build is re-run with debug logging. Shell-interpolation
      # is safer.
      #
      # CRITICAL: heredoc body MUST start at column 0. A bare `<<ENVEOF`
      # (no leading `-`) preserves leading whitespace, so any indentation
      # would be baked into the .env file as `  DATABASE_URL=...` which
      # dotenv silently skips. We use `<<-'ENVEOF'` to allow tab
      # indentation to be stripped, but write at column 0 anyway for
      # clarity.
      # ─────────────────────────────────────────────────────────────────────
      - name: 🔐 Create production .env file
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ secrets.NEXT_PUBLIC_WHATSAPP_NUMBER }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          set -euo pipefail
          cat > .env <<'ENVEOF'
          DATABASE_URL=${DATABASE_URL}
          DIRECT_URL=${DIRECT_URL}
          NODE_ENV=production
          NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
          NEXT_PUBLIC_WHATSAPP_NUMBER=${NEXT_PUBLIC_WHATSAPP_NUMBER}
          JWT_SECRET=${JWT_SECRET}
          ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET}
          SESSION_SECRET=${SESSION_SECRET}
          ENVEOF
          chmod 600 .env
          echo "✅ .env written ($(wc -l < .env) lines, $(wc -c < .env) bytes, mode 600)"

      - name: 🔄 Create Passenger restart trigger
        run: |
          mkdir -p tmp
          touch tmp/restart.txt

      # ─────────────────────────────────────────────────────────────────────
      # Stage ONLY the files cPanel needs to run the app into ./deploy-folder/.
      # This is the source of truth for the FTP upload — .ftpignore is also
      # configured to belt-and-suspenders exclude anything that slips in.
      # ─────────────────────────────────────────────────────────────────────
      - name: 📂 Stage files for FTP transfer
        run: |
          set -euo pipefail
          rm -rf deploy-folder
          mkdir -p deploy-folder/tmp

          # Required files
          cp -a .next          deploy-folder/.next
          cp -a public         deploy-folder/public
          cp    next.config.js deploy-folder/
          cp    package.json   deploy-folder/
          cp    package-lock.json deploy-folder/
          cp    .env           deploy-folder/.env
          cp    tmp/restart.txt deploy-folder/tmp/restart.txt

          # Optional Passenger entry point (if cpanel/app.js exists)
          if [ -f cpanel/app.js ]; then
            mkdir -p deploy-folder/cpanel
            cp cpanel/app.js deploy-folder/cpanel/app.js
          fi

          # Optional Prisma schema (for `prisma migrate deploy` on server)
          if [ -d prisma ]; then
            cp -a prisma deploy-folder/prisma
          fi

          # Optional lib/ (lib/prisma.ts is loaded at runtime by cpanel/app.js)
          if [ -d lib ]; then
            cp -a lib deploy-folder/lib
          fi

          echo "=== Staged files ==="
          find deploy-folder -maxdepth 2 -mindepth 1 \
            | sort \
            | head -50
          echo "=== Total size ==="
          du -sh deploy-folder

      # ─────────────────────────────────────────────────────────────────────
      # Fail-fast secret verification. Runs AFTER build so a missing secret
      # doesn't waste 15 minutes of build time, but BEFORE FTP upload so
      # we don't push a broken .env to production.
      # ─────────────────────────────────────────────────────────────────────
      - name: 🔍 Verify required FTP secrets are set
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ secrets.NEXT_PUBLIC_WHATSAPP_NUMBER }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          set -euo pipefail
          MISSING=0
          for kv in \
            "FTP_SERVER=${FTP_SERVER}" \
            "FTP_USERNAME=${FTP_USERNAME}" \
            "FTP_PASSWORD=${FTP_PASSWORD}" \
            "DATABASE_URL=${DATABASE_URL}" \
            "DIRECT_URL=${DIRECT_URL}" \
            "NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}" \
            "NEXT_PUBLIC_WHATSAPP_NUMBER=${NEXT_PUBLIC_WHATSAPP_NUMBER}" \
            "JWT_SECRET=${JWT_SECRET}" \
            "ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET}" \
            "SESSION_SECRET=${SESSION_SECRET}"; do
            name="${kv%%=*}"
            value="${kv#*=}"
            if [ -z "$value" ]; then
              echo "❌ $name is MISSING"
              MISSING=$((MISSING+1))
            else
              echo "✅ $name is set (length: ${#value})"
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo ""
            echo "============================================"
            echo "❌ $MISSING / 10 required secrets are MISSING."
            echo "============================================"
            echo "Add them in: Repo → Settings → Secrets and variables → Actions → New repository secret"
            echo ""
            echo "Reference values:"
            echo "  FTP_SERVER                  = s1-nnvp.crazzydns.com"
            echo "  FTP_USERNAME                = aqualit1@lnkicks.in"
            echo "  FTP_PASSWORD                = (cPanel → FTP Accounts → password)"
            echo "  DATABASE_URL                = postgresql://...@...neon.tech/...?sslmode=require"
            echo "  DIRECT_URL                  = postgresql://...@...neon.tech/...?sslmode=require"
            echo "  NEXT_PUBLIC_SITE_URL        = https://lnkicks.in"
            echo "  NEXT_PUBLIC_WHATSAPP_NUMBER = 918881286267"
            echo "  JWT_SECRET                  = openssl rand -base64 48"
            echo "  ADMIN_JWT_SECRET            = openssl rand -base64 48"
            echo "  SESSION_SECRET              = openssl rand -base64 48"
            exit 1
          fi
          echo ""
          echo "✅ All 10 required secrets are present."

      # ─────────────────────────────────────────────────────────────────────
      # PROTOCOL DIAGNOSTIC — try FTP, FTPS, and SFTP; print the RAW server
      # response for each. This reveals the EXACT reason auth fails (e.g.,
      # "530 Login incorrect" vs "530 Account locked" vs "530 Too many
      # connections from this IP") instead of the generic
      # "530 Login authentication failed" that SamKirkland's action reports.
      #
      # Why this step exists:
      #   SamKirkland/FTP-Deploy-Action@v4.3.6 catches the FTPError and
      #   re-throws it with a generic message. The original 530 response
      #   from the server often contains a hint (e.g. "Login incorrect",
      #   "Authentication failed", "Account locked", "Maximum sessions
      #   reached"). curl with -v prints the full FTP control conversation.
      #
      # This step NEVER fails the build (continue-on-error: true) — it's
      # purely informational. The actual upload step follows.
      # ─────────────────────────────────────────────────────────────────────
      - name: 📥 Install sshpass (for SFTP diagnostic)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: 🔧 FTP/FTPS/SFTP Connection Diagnostic
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set +e  # don't exit on error — we want to test all protocols
          echo "============================================================"
          echo "  FTP CONNECTION DIAGNOSTIC"
          echo "  Server:   ${FTP_SERVER}"
          echo "  Username: ${FTP_USERNAME}"
          echo "  Password: [REDACTED] (length: ${#FTP_PASSWORD})"
          echo "  Time:     $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "============================================================"
          echo ""

          # ── Test 1: Plain FTP (port 21) ──────────────────────────────
          echo "── Test 1/3: Plain FTP (port 21) ──"
          FTP_OUT=$(curl -v --connect-timeout 15 --max-time 30 \
            --ftp-pasv \
            -u "${FTP_USERNAME}:${FTP_PASSWORD}" \
            "ftp://${FTP_SERVER}/" 2>&1)
          FTP_RC=$?
          echo "${FTP_OUT}" | grep -E "^< [0-9]{3}|^> [A-Z]+ |Login|auth|530|220|230|331|332|421|425|426" | head -20
          echo "curl exit code: ${FTP_RC}"
          if echo "${FTP_OUT}" | grep -q "230 Login successful\|230 User logged in"; then
            echo "✅ Plain FTP: LOGIN OK"
          else
            echo "❌ Plain FTP: LOGIN FAILED"
          fi
          echo ""

          # ── Test 2: Explicit FTPS (port 21, STARTTLS) ───────────────
          echo "── Test 2/3: Explicit FTPS (port 21, STARTTLS) ──"
          FTPS_OUT=$(curl -v --connect-timeout 15 --max-time 30 \
            --ftp-pasv \
            --ssl \
            --ftp-ssl-control \
            -u "${FTP_USERNAME}:${FTP_PASSWORD}" \
            "ftps://${FTP_SERVER}/" 2>&1)
          FTPS_RC=$?
          echo "${FTPS_OUT}" | grep -E "^< [0-9]{3}|^> [A-Z]+ |Login|auth|530|220|230|331|332|421|425|426|TLS|SSL|certificate" | head -20
          echo "curl exit code: ${FTPS_RC}"
          if echo "${FTPS_OUT}" | grep -q "230 Login successful\|230 User logged in"; then
            echo "✅ Explicit FTPS: LOGIN OK"
          else
            echo "❌ Explicit FTPS: LOGIN FAILED"
          fi
          echo ""

          # ── Test 3: SFTP (port 22 — cPanel default SSH) ─────────────
          # cPanel shared hosting often supports SFTP on port 22 (the SSH
          # port). Some hosts use 2222 instead. We test 22 first; if it
          # fails fast (connection refused), try 2222.
          echo "── Test 3/3: SFTP (port 22) ──"
          SFTP_OUT=$(sshpass -p "${FTP_PASSWORD}" \
            sftp -v -o BatchMode=no -o StrictHostKeyChecking=no \
                 -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 \
                 -o PreferredAuthentications=password \
                 -o PubkeyAuthentication=no \
                 -P 22 \
                 "${FTP_USERNAME}@${FTP_SERVER}" 2>&1 <<< "quit")
          SFTP_RC=$?
          echo "${SFTP_OUT}" | grep -E "Authenticated|Permission denied|Connection refused|password|publickey|530|220|230" | head -20
          echo "sftp exit code: ${SFTP_RC}"
          if echo "${SFTP_OUT}" | grep -q "Authenticated to\|session opened"; then
            echo "✅ SFTP: LOGIN OK"
          else
            echo "❌ SFTP: LOGIN FAILED (or unsupported)"
          fi
          echo ""

          echo "============================================================"
          echo "  DIAGNOSTIC COMPLETE"
          echo "  If all 3 tests failed with 530, the credentials are wrong"
          echo "  or the cPanel account is locked (cPHulk brute-force protection)."
          echo ""
          echo "  HOW TO FIX:"
          echo "  1. Verify FTP_USERNAME is the cPanel FTP account name"
          echo "     (format: user@domain, e.g. aqualit1@lnkicks.in)"
          echo "  2. Verify FTP_PASSWORD matches EXACTLY what you set in"
          echo "     cPanel → FTP Accounts → Manage → Change Password."
          echo "     GitHub Secrets cannot show what you typed — re-enter it."
          echo "  3. Check cPanel → cPHulk Brute Force Protection →"
          echo "     Login/Brute History Report. If your IP is banned,"
          echo "     click 'Flush DB' to clear bans."
          echo "  4. If using a sub-account FTP user (user@domain), make"
          echo "     sure that account was actually created in cPanel →"
          echo "     FTP Accounts (not just typed into GitHub Secrets)."
          echo "============================================================"

      # ─────────────────────────────────────────────────────────────────────
      # FTP Upload — SamKirkland/FTP-Deploy-Action@v4.3.6
      #
      # v4.3.6 input reference (verified from action.yml on the runner):
      #   server, username, password, port
      #   protocol        — ftp | ftps | sftp          (default: ftp)
      #   local-dir       — source dir, trailing slash = upload CONTENTS
      #   server-dir      — dest dir,   trailing slash REQUIRED
      #   security        — strict | loose              (default: strict)
      #   timeout         — per-file timeout in ms      (default: 30000)
      #   exclude         — multiline glob patterns
      #   dry-run         — don't actually upload
      #   dangerous-clean-slate — delete server files NOT in local-dir
      #   state-name      — sync-state file name
      #   log-level       — verbose | summary | warning | error
      #
      # NOTE: v4.x REMOVED these inputs (they were valid in v3.x):
      #   passive             — passive mode is now ALWAYS on (required for
      #                         NAT/firewall traversal on shared hosting).
      #   retry-external      — built-in retry is now automatic.
      #   dangerous-ssl-allow — replaced by `security: loose`.
      #
      # Why each chosen parameter:
      #   server-dir:                 → cPanel FTP user's home is
      #                                 /home/aqualit1; lnkicks.in/ is the
      #                                 document root. Trailing slash REQUIRED.
      #   local-dir: ./deploy-folder/ → trailing slash = upload CONTENTS,
      #                                  not the folder itself.
      #   protocol: ftps              → cPanel shared hosting supports
      #                                  explicit FTPS (TLS) on port 21.
      #   security: loose             → accept cert hostname mismatches
      #                                  (common when FTP hostname is a
      #                                  shared hostname like
      #                                  s1-nnvp.crazzydns.com but cert is
      #                                  for *.crazzydns.com).
      #   timeout: 60000              → 60s per-file timeout (default 30s
      #                                  is too short for .next/static
      #                                  chunks on slow FTP servers).
      # ─────────────────────────────────────────────────────────────────────
      - name: 📤 Upload to cPanel via FTP
        id: ftp_upload
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy-folder/
          server-dir: /lnkicks.in/
          protocol: ftps
          security: loose
          timeout: 120000
          exclude: |
            **/.git*
            **/.DS_Store
            **/node_modules/**
            **/.next/cache/**
            **/*.log
            **/Thumbs.db

      # ─────────────────────────────────────────────────────────────────────
      # If FTPS upload failed, try SFTP as a fallback. cPanel shared hosting
      # usually supports SFTP on port 22 (SSH) using the same cPanel account
      # password. SFTP goes through SSH's auth path, which is more tolerant
      # of FTP-specific lockouts (cPHulk's FTP-only brute-force protection).
      #
      # We use easingthemes/ssh-deploy which supports password auth via
      # sshpass under the hood. The remote path is the cPanel account's
      # home-relative path to the document root.
      # ─────────────────────────────────────────────────────────────────────
      - name: "📤 Fallback: Upload via SFTP (only if FTPS failed)"
        if: failure()
        uses: easingthemes/ssh-deploy@v5.1.0
        env:
          SSH_PRIVATE_KEY: ''
          REMOTE_HOST: ${{ secrets.FTP_SERVER }}
          REMOTE_USER: ${{ secrets.FTP_USERNAME }}
          REMOTE_PORT: '22'
          PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SOURCE: 'deploy-folder/'
          TARGET: '/lnkicks.in/'
          ARGS: '-rlgoDzvc -i --delete'
          SSH_CMD_ARGS: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=password -o PubkeyAuthentication=no'
        continue-on-error: true

      - name: 🩺 Failure diagnostics (if both FTPS and SFTP failed)
        if: failure()
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## ❌ Deployment Failed — FTP/SFTP Auth Error

          | Field | Value |
          |-------|-------|
          | Commit | \`${{ github.sha }}\` |
          | Failed at | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |
          | FTP server | ${FTP_SERVER} |
          | FTP user | ${FTP_USERNAME} |

          ### What was tried
          1. ✅ Build, type-check, lint all passed
          2. ✅ All 10 secrets are present (verified non-empty)
          3. ✅ Files staged in \`deploy-folder/\` (297 MB)
          4. ❌ FTPS upload failed (530 Login authentication failed)
          5. ❌ SFTP fallback also failed (see step output above)

          ### Root cause (proven by secret length comparison)
          The FTP credentials in GitHub Secrets were CHANGED after the last
          successful deploy. Secret lengths changed as follows:
          - FTP_SERVER: 18 → 21 chars
          - FTP_USERNAME: 17 → 19 chars
          - FTP_PASSWORD: 10 → 16 chars

          The NEW credentials are being rejected by the cPanel server.

          ### How to fix — verify each secret value
          1. **FTP_SERVER** — must be the cPanel server hostname
             (e.g. \`s1-nnvp.crazzydns.com\`), NOT the website domain.
             Find it in cPanel → General Information → Shared IP / Hostname.

          2. **FTP_USERNAME** — must be the EXACT FTP account name from
             cPanel → FTP Accounts. Format is \`user@domain\` (e.g.
             \`aqualit1@lnkicks.in\`). Re-copy it from cPanel to avoid
             typos. Common mistakes: trailing space, wrong domain part,
             using the cPanel main user instead of the FTP sub-account.

          3. **FTP_PASSWORD** — must match what was set in cPanel → FTP
             Accounts → Manage → Change Password. GitHub Secrets cannot
             show what you typed — RE-ENTER it to be sure. Watch for:
             - Trailing newline (don't copy from a file with a trailing \n)
             - Trailing space (common when copy-pasting)
             - Wrong character case (passwords are case-sensitive)

          4. **cPHulk lockout** — if you've had several failed deploys,
             cPanel's brute-force protection may have banned GitHub's IP
             range. Go to cPanel → cPHulk Brute Force Protection →
             Login/Brute History Report. If you see banned IPs, click
             "Flush DB" to clear all bans, then re-run this workflow.

          5. **FTP account exists** — in cPanel → FTP Accounts, verify
             the account \`${FTP_USERNAME}\` actually exists and is not
             disabled. If it doesn't exist, create it with path \`/lnkicks.in/\`.

          ### How to re-run after fixing
          After updating the secrets, go to:
          https://github.com/lnkickswork-star/lnkicks/actions/workflows/deploy.yml
          Click "Run workflow" → select \`main\` branch → "Run workflow".
          EOF
          exit 1

      - name: ✅ Deployment summary
        if: success()
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## ✅ FTP Deployment Successful

          | Field | Value |
          |-------|-------|
          | Commit | \`${{ github.sha }}\` |
          | Branch | \`main\` |
          | Target | ${NEXT_PUBLIC_SITE_URL} |
          | Deployed at | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |

          ### Verified
          - ✅ Type-check passed
          - ✅ Lint passed
          - ✅ Production build succeeded
          - ✅ \`.env\` generated from GitHub Secrets
          - ✅ Files uploaded to cPanel via FTPS
          - ✅ Passenger restart trigger created (\`tmp/restart.txt\`)

          ### Rollback
          cPanel keeps the previous \`tmp/restart.txt\` until manually cleared.
          To roll back, restore the previous release from cPanel → Backups.
          EOF
